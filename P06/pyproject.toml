[project]
name = "project6-credit-scoring-mlops"
version = "0.1.0"
description = "Credit scoring with MLflow and MLOps"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "mlflow",
    "matplotlib",
    "seaborn",
    "jupyterlab",
    "ipykernel",
    "lightgbm>=4.0.0",
    "xgboost>=3.2.0",
    "optuna>=4.8.0",
    "imbalanced-learn>=0.14.1",
    "missingno>=0.5.2",
    "plotly>=6.7.0",
    "pyarrow>=23.0.1",
    "numba>=0.59",
    "llvmlite>=0.41",
    "shap>=0.49.1",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]
